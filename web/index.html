<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Inter";src:url("assets/inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{cursor:default}
button{all:unset;box-sizing:border-box}

/* The design lives on a fixed 1920x1080 stage that is scaled to whatever the screen reports. */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
  font-family:Inter,system-ui,sans-serif;font-optical-sizing:auto;
  --fg:#FFFFFF;--fg2:rgba(255,255,255,.78);--card:rgba(0,0,0,.26)}
#stage.light{--fg:#1D1D1F;--fg2:rgba(29,29,31,.72);--card:rgba(255,255,255,.46)}
#stage{color:var(--fg)}

/* backgrounds: stacked, cross-faded. opacity only, so it is cheap on a weak GPU */
.bg{position:absolute;inset:0;width:1920px;height:1080px;opacity:0;transition:opacity 1400ms ease}
.bg.on{opacity:1}

/* ambient motion: the active background slowly pans/zooms and two soft glows drift over it.
   transform/opacity only (GPU-composited, no repaints); paused while the screensaver covers it. */
.bg.on{animation:bgdrift 60s ease-in-out infinite alternate;will-change:transform}
@keyframes bgdrift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.10) translate(-34px,-20px)}}
#glow{position:absolute;left:-240px;top:-240px;width:2400px;height:1560px;pointer-events:none;will-change:transform;
  background:radial-gradient(640px 420px at 30% 38%,var(--g1),transparent 70%),radial-gradient(760px 520px at 74% 68%,var(--g2),transparent 70%);
  animation:glow 28s ease-in-out infinite alternate}
#stage{--g1:rgba(110,140,255,.20);--g2:rgba(80,190,220,.14)}
#stage.light{--g1:rgba(255,190,120,.22);--g2:rgba(255,140,170,.14)}
@keyframes glow{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(140px,-70px) rotate(7deg)}100%{transform:translate(-90px,50px) rotate(-5deg)}}
#stage.asleep .bg.on,#stage.asleep #glow{animation-play-state:paused}

#msg{position:absolute;left:96px;top:110px;width:1160px;margin:0;font-size:88px;font-weight:650;line-height:1.04;letter-spacing:-.03em;transition:opacity 400ms}
.card{position:absolute;left:1383px;width:440px;border-radius:36px;background:var(--card);padding:28px 34px;display:flex;flex-direction:column;justify-content:space-between}
#clock{top:117px;height:206px}
#wx{top:343px;height:290px}
.row{display:flex;align-items:baseline;gap:10px}
#time{font-size:108px;font-weight:250;line-height:.85;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#ampm{font-size:36px;font-weight:500}
#date,#feels{font-size:28px;font-weight:500;color:var(--fg2)}
.wxtop{display:flex;justify-content:space-between;align-items:center}
#city{font-size:30px;font-weight:600}
#temp{font-size:104px;font-weight:250;line-height:.85;letter-spacing:-.03em}
#cond{font-size:30px;font-weight:600}
.wxbot{display:flex;flex-direction:column;gap:4px}

/* app tiles: the row slides left/right so the focused tile stays between x=98 and x=1824 */
#apps{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;transition:transform 300ms cubic-bezier(.2,.8,.2,1)}
#apps .slot{pointer-events:auto}
.slot{position:absolute;top:748px;width:254px;height:152px}
.sh{position:absolute;left:-83px;top:-40px;width:420px;height:290px;opacity:0;transition:opacity 220ms ease-out;pointer-events:none}
.tile{position:absolute;inset:0;border-radius:28px;background:#1C1C1E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transform-origin:50% 60%;transition:transform 220ms cubic-bezier(.2,.9,.25,1.1),background 160ms,color 160ms}
.tile>span{display:flex;align-items:center;justify-content:center;color:inherit}
.lbl{position:absolute;left:-40px;width:334px;top:194px;text-align:center;font-size:30px;font-weight:600;opacity:0;transition:opacity 220ms}
.slot.on .tile{transform:translateY(-12px) scale(1.14);background:#FFFFFF;color:#111113}
.slot.on .sh,.slot.on .lbl{opacity:1}
.slot.on .lbl{color:var(--fg)}
.lg-f{display:none}
.slot.on .lg-n{display:none}
.slot.on .lg-f{display:block}

/* screensaver */
#saver{position:absolute;inset:0;background:#070B12;color:#fff;opacity:0;visibility:hidden;transition:opacity 900ms ease,visibility 0s 900ms}
#saver.on{opacity:1;visibility:visible;transition:opacity 900ms ease}
#saver img{position:absolute;inset:0;width:1920px;height:1080px}
#saver.on img{animation:kb 90s ease-in-out infinite alternate}
#drift{position:absolute;left:130px;bottom:120px;display:flex;flex-direction:column;gap:22px}
#saver.on #drift{animation:drift 180s linear infinite alternate}
#stime{font-size:220px;font-weight:250;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#sampm{font-size:60px;font-weight:400}
#smsg{margin:0;font-size:52px;font-weight:600;letter-spacing:-.02em}
#swx{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:500;color:rgba(255,255,255,.78)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(36px,-28px)}}

/* ============ Now Playing: sleeve + spinning vinyl + glows tinted from the cover, pulsing to the bass ============
   Everything that moves per frame is transform/opacity only. Colours (--np1/--np2) change once per song. */
#np{position:absolute;left:96px;top:392px;width:1180px;height:300px;opacity:0;visibility:hidden;transform:translateY(18px);
  transition:opacity 500ms ease,transform 500ms ease,visibility 0s 500ms;--np1:rgb(120,140,255);--np2:rgb(90,200,220)}
#np.on{opacity:1;visibility:visible;transform:none;transition:opacity 500ms ease,transform 500ms ease}
.sglow{position:absolute;left:-18px;top:-18px;width:336px;height:336px;border-radius:34px;background:linear-gradient(135deg,var(--np1),var(--np2));
  filter:blur(26px);opacity:.45;will-change:transform,opacity;z-index:1}
.sleeve{position:absolute;left:0;top:0;width:300px;height:300px;border-radius:16px;overflow:hidden;background:#222;z-index:3;
  box-shadow:0 22px 50px rgba(0,0,0,.5)}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block}
.vwrap{position:absolute;left:24px;top:12px;width:276px;height:276px;z-index:2;transition:transform 900ms cubic-bezier(.2,.8,.2,1)}
#np.playing .vwrap{transform:translateX(150px)}                     /* the record slides out of its sleeve */
.vring{position:absolute;left:-40px;top:-40px;width:356px;height:356px;border-radius:50%;opacity:.3;will-change:transform,opacity;
  background:radial-gradient(circle,transparent 52%,var(--np1) 60%,var(--np2) 66%,transparent 74%)}
.vinyl{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,#0b0b0d 0 15%,transparent 15.5%),
             repeating-radial-gradient(circle,#141416 0 1.6px,#1d1d20 1.6px 3.2px);
  box-shadow:0 10px 30px rgba(0,0,0,.55);animation:spin 1.8s linear infinite;animation-play-state:paused;will-change:transform}
#np.playing .vinyl{animation-play-state:running}
.vlabel{position:absolute;left:32%;top:32%;width:36%;height:36%;border-radius:50%;background:#333 center/cover no-repeat;
  box-shadow:0 0 0 3px rgba(0,0,0,.6)}
.vlabel::after{content:"";position:absolute;left:44%;top:44%;width:12%;height:12%;border-radius:50%;background:#0b0b0d}
.vsheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 35deg,transparent 0 8%,rgba(255,255,255,.10) 12%,transparent 18% 50%,rgba(255,255,255,.07) 62%,transparent 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
.npmeta{position:absolute;left:520px;top:28px;width:660px}
#np-app{font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
#np-title{margin-top:12px;font-size:56px;font-weight:650;line-height:1.05;letter-spacing:-.02em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#np-artist{margin-top:12px;font-size:32px;font-weight:500;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npbar{position:absolute;left:520px;bottom:24px;width:640px;height:6px;border-radius:3px;background:rgba(127,127,127,.3);overflow:hidden}
.npbar i{display:block;width:100%;height:100%;background:var(--fg);transform-origin:0 50%;transform:scaleX(0)}
#edge{position:absolute;inset:0;pointer-events:none;opacity:0;will-change:opacity;
  box-shadow:inset 0 0 160px 24px var(--np1),inset 0 0 46px 4px var(--np2)}

/* top-right pills: All apps / Settings (Up from the tiles) */
#top{position:absolute;right:97px;top:34px;display:flex;gap:14px}
.pill{height:58px;padding:0 26px;border-radius:29px;background:var(--card);color:var(--fg);font-size:26px;font-weight:600;
  display:flex;align-items:center;gap:12px;transition:transform 200ms cubic-bezier(.2,.9,.25,1.1),background 160ms,color 160ms}
.pill svg{width:26px;height:26px}
.pill.on{background:#FFFFFF;color:#111113;transform:scale(1.08)}

/* app drawer */
#drawer{position:absolute;inset:0;background:rgba(7,10,16,.94);opacity:0;visibility:hidden;transition:opacity 260ms,visibility 0s 260ms}
#drawer.on{opacity:1;visibility:visible;transition:opacity 260ms}
#drawer h2{position:absolute;left:96px;top:64px;margin:0;font-size:52px;font-weight:650;letter-spacing:-.02em;color:#fff}
#dhint{position:absolute;right:97px;top:82px;font-size:24px;font-weight:500;color:rgba(255,255,255,.55)}
#dview{position:absolute;left:0;top:170px;width:1920px;height:910px;overflow:hidden}
#dgrid{position:absolute;left:96px;top:24px;width:1728px;display:grid;grid-template-columns:repeat(6,254px);column-gap:40px;row-gap:34px;transition:transform 260ms ease}
.app{display:flex;flex-direction:column;align-items:center;gap:12px}
.app .ban{width:254px;height:143px;border-radius:20px;background:#1C1C1E;overflow:hidden;display:flex;align-items:center;justify-content:center;
  transition:transform 200ms cubic-bezier(.2,.9,.25,1.1),box-shadow 200ms}
.app .ban img.b{width:100%;height:100%;object-fit:cover}
.app .ban img.i{width:84px;height:84px}
.app span{font-size:22px;font-weight:600;color:rgba(255,255,255,.7);max-width:254px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.on .ban{transform:scale(1.1);box-shadow:0 0 0 4px #fff,0 18px 40px rgba(0,0,0,.5)}
.app.on span{color:#fff}
#dempty{position:absolute;left:96px;top:200px;font-size:30px;color:rgba(255,255,255,.6)}

#toast{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:26px;font-weight:500;opacity:0;transition:opacity 250ms;pointer-events:none}
#toast.on{opacity:.9}
</style>
</head>

  80:["Showers","rain"],81:["Showers","rain"],82:["Heavy Showers","rain"],85:["Snow Showers","snow"],86:["Snow Showers","snow"],
  95:["Thunderstorm","storm"],96:["Thunderstorm","storm"],99:["Thunderstorm","storm"]

var row = document.getElementById("apps"), shift = 0;
var ROW_L = 98, ROW_R = 1824, TILE_W = 254;          // visible band for the tile row on the 1920 stage
function scrollRow() {
  var x = parseFloat(slots[cur].style.left);
  if (x + shift < ROW_L) shift = ROW_L - x;            // focused tile went off the left: slide right
  if (x + TILE_W + shift > ROW_R) shift = ROW_R - TILE_W - x;   // off the right: slide left
  row.style.transform = "translateX(" + shift + "px)";
}
function setFocus(i) {

  b.addEventListener("focus", function () { cur = i; slots.forEach(function (x, n) { x.classList.toggle("on", n === i); }); });

    el.appendChild(ban); el.appendChild(lb);
    el.addEventListener("click", function () { dcur = i; launchDrawer(); });
    dgrid.appendChild(el);
  });
  document.getElementById("dempty").hidden = list.length > 0;
}
function setDrawerFocus(i) {
  if (!dapps.length) return;
  dcur = Math.max(0, Math.min(dapps.length - 1, i));
  [].forEach.call(dgrid.children, function (c, n) { c.classList.toggle("on", n === dcur); });
  var r = Math.floor(dcur / DCOLS);
  dgrid.style.transform = "translateY(" + (-Math.max(0, r - 2) * DROW_H) + "px)";   // keep the focused row in view
}
function openDrawer() { loadApps(); drawer.classList.add("on"); zone = "drawer"; pills.forEach(function (p) { p.classList.remove("on"); }); setDrawerFocus(0); }
function closeDrawer() { drawer.classList.remove("on"); setFocus(cur); }
function launchDrawer() {
  var a = dapps[dcur]; if (!a) return;
  if (window.Android && typeof window.Android.launch === "function") window.Android.launch(JSON.stringify([a.pkg]));
  else toast("Prototype: this would open " + a.label);
  closeDrawer();
}
function activatePill() { if (pcur === 0) openDrawer(); else openSettings(); }
pills.forEach(function (p, i) { p.addEventListener("click", function () { wake(); pcur = i; activatePill(); }); });

document.addEventListener("keydown", function (e) {
  if (wake()) { e.preventDefault(); return; }          // first key only wakes the screen
  var k = e.key, c = e.keyCode;
  var L = k === "ArrowLeft" || c === 21, R = k === "ArrowRight" || c === 22, U = k === "ArrowUp" || c === 19, D = k === "ArrowDown" || c === 20;
  var OK = k === "Enter" || k === " " || c === 23 || c === 66, BACK = k === "Escape" || k === "Backspace" || k === "GoBack" || c === 4;
  if (!(L || R || U || D || OK || BACK)) return;
  e.preventDefault();
  if (zone === "drawer") {
    var last = dapps.length - 1;
    if (BACK) closeDrawer();
    else if (L) setDrawerFocus(dcur - 1);
    else if (R) setDrawerFocus(dcur + 1);
    else if (U) { if (dcur - DCOLS >= 0) setDrawerFocus(dcur - DCOLS); }
    else if (D) { if (dcur + DCOLS <= last) setDrawerFocus(dcur + DCOLS); else if (Math.floor(dcur / DCOLS) < Math.floor(last / DCOLS)) setDrawerFocus(last); }
    else if (OK) launchDrawer();
  } else if (zone === "top") {
    if (L) focusPill(0);
    else if (R) focusPill(1);
    else if (D || BACK) setFocus(cur);
    else if (OK) activatePill();
  } else {
    if (R) setFocus(cur + 1);
    else if (L) setFocus(cur - 1);
    else if (U) focusPill(0);
    else if (OK) launch(cur);
  }
});
// The Android shell calls these: Home pressed while we're open, and the remote's Back button.
window.onHome = function () { wake(); drawer.classList.remove("on"); setFocus(0); };
window.onBack = function () { if (zone === "drawer") closeDrawer(); else if (zone === "top") setFocus(cur); };
document.addEventListener("mousemove", function () { if (idle) wake(); });

/* ============================ Now Playing ============================
   Android pushes {active, playing, title, artist, app, art, position, duration, speed, reactive} via
   window.onNowPlaying; Android.level() gives live bass loudness 0..1 for the pulse.
   ?np=1 in a browser shows a demo track with a synthetic beat. */
var np = document.getElementById("np"), edge = document.getElementById("edge");
var npRing = np.querySelector(".vring"), npGlow = np.querySelector(".sglow"), npBar = document.getElementById("np-bar");
var npState = null, npStamp = 0, npArt = "", npLevel = 0, npQuietSince = 0, npRaf = 0;

/* Two glow colours from the cover: the strongest vivid hue, and a second one at least 60 degrees away. */
function coverColours(img, done) {
  try {
    var c = document.createElement("canvas"); c.width = c.height = 24;
    var g = c.getContext("2d"); g.drawImage(img, 0, 0, 24, 24);
    var d = g.getImageData(0, 0, 24, 24).data, bins = [];
    for (var b = 0; b < 12; b++) bins.push({ w: 0, r: 0, g: 0, b: 0 });
    for (var i = 0; i < d.length; i += 4) {
      var r = d[i] / 255, gg = d[i + 1] / 255, bb = d[i + 2] / 255;
      var mx = Math.max(r, gg, bb), mn = Math.min(r, gg, bb), s = mx ? (mx - mn) / mx : 0, h = 0;
      if (mx - mn > 0.0001) {
        h = mx === r ? ((gg - bb) / (mx - mn)) % 6 : mx === gg ? (bb - r) / (mx - mn) + 2 : (r - gg) / (mx - mn) + 4;
        h = (h * 60 + 360) % 360;
      }
      var w = s * s * mx + 0.02, k = Math.floor(h / 30) % 12;
      bins[k].w += w; bins[k].r += d[i] * w; bins[k].g += d[i + 1] * w; bins[k].b += d[i + 2] * w;
    }
    var order = bins.map(function (x, k) { return k; }).sort(function (a, b) { return bins[b].w - bins[a].w; });
    var a = order[0], second = order.filter(function (k) { var dd = Math.abs(k - a); return Math.min(dd, 12 - dd) >= 2; })[0];
    done(vivid(bins[a]), vivid(bins[second === undefined ? a : second], second === undefined));
  } catch (e) { done("rgb(120,140,255)", "rgb(90,200,220)"); }
}
/* Average colour of a hue bin, pushed bright and saturated enough to read as light on a dark screen. */
function vivid(bin, lighter) {
  var r = bin.r / bin.w / 255, g = bin.g / bin.w / 255, b = bin.b / bin.w / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = 0, d = mx - mn;
  if (d > 0.0001) {
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
    s = d / (1 - Math.abs(mx + mn - 1));
  }
  // keep the cover's hue, but force enough saturation/lightness to glow; near-grey covers get a soft neutral
  s = s < 0.08 ? 0.12 : Math.max(s, 0.68);
  return "hsl(" + Math.round(h) + "," + Math.round(s * 100) + "%," + (lighter ? 70 : 60) + "%)";
}

function placeNp() {                                   // sit under the greeting however many lines it wraps to
  var top = 110 + document.getElementById("msg").offsetHeight + 36;
  np.style.top = Math.max(380, Math.min(420, top)) + "px";
}

window.onNowPlaying = function (s) {
  npState = s; npStamp = Date.now();
  var show = !!(s && s.active && (s.title || s.artist));
  np.classList.toggle("on", show);
  np.classList.toggle("playing", show && !!s.playing);
  if (!show) { edge.style.opacity = 0; stopPulse(); return; }
  document.getElementById("np-app").textContent = (s.app || "Now playing") + (s.playing ? " · Now playing" : " · Paused");
  document.getElementById("np-title").textContent = s.title || "";
  document.getElementById("np-artist").textContent = [s.artist, s.album].filter(Boolean).join(" — ");
  if (s.art && s.art !== npArt) {
    npArt = s.art;
    var img = document.getElementById("np-art");
    img.onload = function () {
      coverColours(img, function (c1, c2) { np.style.setProperty("--np1", c1); np.style.setProperty("--np2", c2);
                                            edge.style.setProperty("--np1", c1); edge.style.setProperty("--np2", c2); });
    };
    img.src = s.art;
    np.querySelector(".vlabel").style.backgroundImage = "url(" + s.art + ")";
  }
  placeNp();
  startPulse();
};

function startPulse() { if (!npRaf) npRaf = requestAnimationFrame(pulse); }
function stopPulse() { if (npRaf) cancelAnimationFrame(npRaf); npRaf = 0; npLevel = 0; }

function pulse(t) {
  npRaf = 0;
  var s = npState;
  if (!s || !s.active) return;
  var playing = !!s.playing && !idle;
  // live bass from the TV's output if the visualizer works; otherwise (or if it reads silence) a soft ~118 bpm breath
  var raw = 0, live = false;
  if (playing && s.reactive && window.Android && typeof window.Android.level === "function") {
    raw = +window.Android.level() || 0;
    if (raw > 0.02) { live = true; npQuietSince = 0; } else if (!npQuietSince) npQuietSince = t;
    if (npQuietSince && t - npQuietSince < 2500) live = true;          // brief gaps between songs aren't "broken"
  }
  if (playing && !live) { var ph = (t / 1000) * (118 / 60) * Math.PI * 2; raw = 0.38 + 0.32 * Math.pow((Math.sin(ph) + 1) / 2, 3); }
  if (!playing) raw = 0.12;
  npLevel += (raw - npLevel) * (raw > npLevel ? 0.55 : 0.12);         // fast attack, slow release
  var L = npLevel;
  npRing.style.opacity = (0.25 + 0.75 * L).toFixed(3);
  npRing.style.transform = "scale(" + (1 + 0.09 * L).toFixed(4) + ")";
  npGlow.style.opacity = (0.30 + 0.55 * L).toFixed(3);
  npGlow.style.transform = "scale(" + (1 + 0.05 * L).toFixed(4) + ")";
  edge.style.opacity = zone === "drawer" ? 0 : (playing ? (0.12 + 0.55 * L) : 0).toFixed(3);
  // progress bar, extrapolated from the last update
  if (s.duration > 0) {
    var pos = s.position + (Date.now() - npStamp) * (s.speed || 0);
    npBar.style.transform = "scaleX(" + Math.max(0, Math.min(1, pos / s.duration)).toFixed(4) + ")";
  }
  npRaf = requestAnimationFrame(pulse);
}

if (Q.get("np")) {                                     // browser demo: ?np=1
  var demoArt = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d7f"/><stop offset=".55" stop-color="#7a2bff"/><stop offset="1" stop-color="#1fd1f9"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><circle cx="210" cy="90" r="46" fill="#ffd166" opacity=".9"/></svg>');
  setTimeout(function () { window.onNowPlaying({ active: true, playing: true, title: "Night Drive", artist: "Demo Artist", album: "Preview",
    app: "Spotify", art: demoArt, position: 42000, duration: 214000, speed: 1, reactive: false }); }, 300);
}

/* ============================ boot ============================ */
loadCachedWx(); render(true); fetchWx();
setInterval(function () { render(false); }, 1000);
setInterval(fetchWx, WEATHER_REFRESH_MIN * 60 * 1000);
setFocus(0); wake();
</script>
</body>
