<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Inter";src:url("assets/inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{cursor:default}
button{all:unset;box-sizing:border-box}

/* The design lives on a fixed 1920x1080 stage that is scaled to whatever the screen reports. */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
  font-family:Inter,system-ui,sans-serif;font-optical-sizing:auto;
  --fg:#FFFFFF;--fg2:rgba(255,255,255,.78);--card:rgba(0,0,0,.26)}
#stage.light{--fg:#1D1D1F;--fg2:rgba(29,29,31,.72);--card:rgba(255,255,255,.46)}
#stage{color:var(--fg)}

/* backgrounds: stacked, cross-faded. opacity only, so it is cheap on a weak GPU */
.bg{position:absolute;inset:0;width:1920px;height:1080px;opacity:0;transition:opacity 1400ms ease}
.bg.on{opacity:1}

/* ambient motion: the active background slowly pans/zooms and two soft glows drift over it.
   transform/opacity only (GPU-composited, no repaints); paused while the screensaver covers it. */
.bg.on{animation:bgdrift 60s ease-in-out infinite alternate;will-change:transform}
@keyframes bgdrift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.10) translate(-34px,-20px)}}
#glow{position:absolute;left:-240px;top:-240px;width:2400px;height:1560px;pointer-events:none;will-change:transform;
  background:radial-gradient(640px 420px at 30% 38%,var(--g1),transparent 70%),radial-gradient(760px 520px at 74% 68%,var(--g2),transparent 70%);
  animation:glow 28s ease-in-out infinite alternate}
#stage{--g1:rgba(110,140,255,.20);--g2:rgba(80,190,220,.14)}
#stage.light{--g1:rgba(255,190,120,.22);--g2:rgba(255,140,170,.14)}
@keyframes glow{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(140px,-70px) rotate(7deg)}100%{transform:translate(-90px,50px) rotate(-5deg)}}
#stage.asleep .bg.on,#stage.asleep #glow{animation-play-state:paused}

#msg{position:absolute;left:96px;top:110px;width:1160px;margin:0;font-size:88px;font-weight:650;line-height:1.04;letter-spacing:-.03em;transition:opacity 400ms}
.card{position:absolute;left:1383px;width:440px;border-radius:36px;background:var(--card);padding:28px 34px;display:flex;flex-direction:column;justify-content:space-between}
#clock{top:117px;height:206px}
#wx{top:343px;height:290px}
.row{display:flex;align-items:baseline;gap:10px}
#time{font-size:108px;font-weight:250;line-height:.85;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#ampm{font-size:36px;font-weight:500}
#date,#feels{font-size:28px;font-weight:500;color:var(--fg2)}
.wxtop{display:flex;justify-content:space-between;align-items:center}
#city{font-size:30px;font-weight:600}
#temp{font-size:104px;font-weight:250;line-height:.85;letter-spacing:-.03em}
#cond{font-size:30px;font-weight:600}
.wxbot{display:flex;flex-direction:column;gap:4px}

/* app tiles: the row slides left/right so the focused tile stays between x=98 and x=1824 */
#apps{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;transition:transform 300ms cubic-bezier(.2,.8,.2,1)}
#apps .slot{pointer-events:auto}
.slot{position:absolute;top:748px;width:254px;height:152px}
.sh{position:absolute;left:-83px;top:-40px;width:420px;height:290px;opacity:0;transition:opacity 220ms ease-out;pointer-events:none}
.tile{position:absolute;inset:0;border-radius:28px;background:#1C1C1E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transform-origin:50% 60%;transition:transform 220ms cubic-bezier(.2,.9,.25,1.1),background 160ms,color 160ms}
.tile>span{display:flex;align-items:center;justify-content:center;color:inherit}
.lbl{position:absolute;left:-40px;width:334px;top:194px;text-align:center;font-size:30px;font-weight:600;opacity:0;transition:opacity 220ms}
.slot.on .tile{transform:translateY(-12px) scale(1.14);background:#FFFFFF;color:#111113}
.slot.on .sh,.slot.on .lbl{opacity:1}
.slot.on .lbl{color:var(--fg)}
.lg-f{display:none}
.slot.on .lg-n{display:none}
.slot.on .lg-f{display:block}

/* screensaver */
#saver{position:absolute;inset:0;background:#070B12;color:#fff;opacity:0;visibility:hidden;transition:opacity 900ms ease,visibility 0s 900ms}
#saver.on{opacity:1;visibility:visible;transition:opacity 900ms ease}
#saver img{position:absolute;inset:0;width:1920px;height:1080px}
#saver.on img{animation:kb 90s ease-in-out infinite alternate}
#drift{position:absolute;left:130px;bottom:120px;display:flex;flex-direction:column;gap:22px}
#saver.on #drift{animation:drift 180s linear infinite alternate}
#stime{font-size:220px;font-weight:250;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#sampm{font-size:60px;font-weight:400}
#smsg{margin:0;font-size:52px;font-weight:600;letter-spacing:-.02em}
#swx{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:500;color:rgba(255,255,255,.78)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(36px,-28px)}}

/* ============ Now Playing (from the "Google TV Home" design canvas) ============
   Home card = "Shelf — Now playing on Home"; full screen = "Music screensaver" / "Music player · controls shown".
   Glow colours come from the cover; the beat is the live bass when the TV allows it, else the design's 0.47 s. */
.pbar{height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.pbar i{display:block;width:100%;height:8px;border-radius:4px;background:#FFFFFF;transform-origin:0 50%;transform:scaleX(0)}
.ctls{display:flex;gap:10px;align-items:center}
.cbtn{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;
  transition:transform 240ms cubic-bezier(.2,.9,.25,1.15),background 160ms,color 160ms}
.cbtn svg{width:40px;height:40px}
.cbtn.on{background:#FFFFFF;color:#111113;transform:translateY(-10px) scale(1.16)}
/* full-screen music screensaver */
#msaver{position:absolute;inset:0;overflow:hidden;background:var(--mbase);color:#FFFFFF;opacity:0;visibility:hidden;
  transition:opacity 900ms ease,visibility 0s 900ms;
  --mbase:#1E1712;--m1:#FF6B3D;--m2:#F2B27A;--m3:#E0607E;--m4:#F7D9A8;--m5:#FF8A3D}
#msaver.on{opacity:1;visibility:visible;transition:opacity 900ms ease}
.mglowwrap{position:absolute;inset:0;will-change:opacity}
.mglow{position:absolute;left:-240px;top:-660px;width:2400px;height:2400px;will-change:transform;
  animation:mspin 9s linear infinite}
#msaver:not(.on) *{animation-play-state:paused!important}   /* hidden: nothing spins in the background */
/* the glow is a 512 px image of the conic gradient, stretched by the GPU: a 2400 px painted layer was too big
   for the TV's tile memory, so rotating corners went undrawn (dark wedges) and other parts (the title) dropped out */
.mmask{position:absolute;left:30px;top:30px;width:1860px;height:1020px;border-radius:44px;background:var(--mbase);
  box-shadow:0 0 12px 8px var(--mbase);will-change:transform}
.mvwrap{position:absolute;left:770px;top:190px;width:380px;height:380px;will-change:transform;transition:translate 520ms cubic-bezier(.2,.7,.2,1)}
.mvinyl{position:absolute;inset:0;animation:mspin 1.8s linear infinite;will-change:transform}
.mvinyl svg{display:block}
.mlabel{position:absolute;left:116px;top:116px;width:148px;height:148px;border-radius:50%;background:#5A4636 center/cover no-repeat}
.mlabel::after{content:"";position:absolute;left:67px;top:67px;width:14px;height:14px;border-radius:50%;background:var(--mbase)}
.marm{position:absolute;left:1260px;top:80px;width:68px;height:68px}
.marm>div{position:absolute;inset:0;transform-origin:34px 34px;animation:marm 3.6s ease-in-out infinite alternate}
@keyframes marm{from{transform:rotate(0deg)}to{transform:rotate(.8deg)}}
.mbars{position:absolute;left:530px;width:860px;top:608px;display:flex;justify-content:space-between;align-items:flex-start;transition:opacity 400ms}
.mbars>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.mbars .up{height:72px;display:flex;align-items:flex-end}
.mbars .up span{display:block;width:10px;border-radius:5px 5px 0 0;background:rgba(255,255,255,.9);transform-origin:50% 100%;animation:mbar .8s ease-in-out infinite alternate}
.mbars .dn{display:block;width:10px;border-radius:0 0 5px 5px;background:rgba(255,255,255,.18);transform-origin:50% 0;animation:mbar .8s ease-in-out infinite alternate}
@keyframes mbar{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.mtext{position:absolute;left:0;right:0;top:770px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;will-change:translate;transition:translate 520ms cubic-bezier(.2,.7,.2,1)}
#m-title{margin:0;font-size:84px;font-weight:700;line-height:1;letter-spacing:-.035em;max-width:1500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#m-artist{font-size:40px;font-weight:500;color:rgba(255,255,255,.82)}
#m-src{font-size:28px;font-weight:500;color:rgba(255,255,255,.6)}
#m-src2{position:absolute;left:120px;top:100px;font-size:30px;font-weight:600;color:rgba(255,255,255,.75);opacity:0;transition:opacity 400ms}
.mclock{position:absolute;right:120px;top:90px;display:flex;align-items:baseline;gap:10px}
#m-time{font-size:56px;font-weight:300;font-variant-numeric:tabular-nums}
#m-ampm{font-size:28px;font-weight:500}
#mctl{width:760px;margin-top:22px;display:flex;flex-direction:column;gap:10px;opacity:0;visibility:hidden;transition:opacity 280ms ease,visibility 0s 280ms}
#mctl .times{display:flex;justify-content:space-between;font-size:26px;font-weight:500;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
#mbtns{display:flex;align-items:center;gap:40px;margin-top:4px;opacity:0;visibility:hidden;transition:opacity 280ms ease,visibility 0s 280ms}
#mbtns .cbtn{background:rgba(255,255,255,.14)}
#mbtns .cbtn svg{width:38px;height:38px}
#mbtns .cbtn.big{width:104px;height:104px;border-radius:52px}
#mbtns .cbtn.big svg{width:44px;height:44px}
#mbtns .cbtn.on{background:#FFFFFF;color:var(--mbase);transform:translateY(-12px) scale(1.14)}
/* controls shown: everything moves up 30 px, text block to 614 px, bars give way to the controls */
/* same offsets as the design (up 30 px, text 770 -> 614), as GPU translates so nothing re-lays out mid-move */
#msaver.ctl .mvwrap,#msaver.ctl .marm{translate:0 -30px}
#msaver.ctl .mtext{translate:0 -156px}
#msaver.ctl .mbars{opacity:0}
#msaver.ctl #m-src{display:none}
#msaver.ctl #m-src2{opacity:1}
#msaver.ctl #mctl,#msaver.ctl #mbtns{opacity:1;visibility:visible;transition:opacity 280ms ease 120ms}
/* the design's fixed 0.47 s beat (used when there is no live bass) */
#msaver.beat .mglowwrap{animation:mglowbeat .47s cubic-bezier(.2,.8,.3,1) infinite}
#msaver.beat .mmask{animation:mmaskbeat .47s cubic-bezier(.2,.8,.3,1) infinite}
#msaver.beat .mvwrap{animation:mpulse .47s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes mglowbeat{0%{opacity:1}100%{opacity:.6}}
@keyframes mmaskbeat{0%{transform:scale(.993,.988)}100%{transform:scale(1,1)}}
@keyframes mpulse{0%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes mspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#msaver.paused .mvinyl,#msaver.paused .mbars span,#msaver.paused .mbars .dn,#msaver.paused .mglow{animation-play-state:paused}

/* top-right pills: All apps / Settings (Up from the tiles) */
#top{position:absolute;right:97px;top:34px;display:flex;gap:14px}
.pill{height:58px;padding:0 26px;border-radius:29px;background:var(--card);color:var(--fg);font-size:26px;font-weight:600;
  display:flex;align-items:center;gap:12px;transition:transform 200ms cubic-bezier(.2,.9,.25,1.1),background 160ms,color 160ms}
.pill svg{width:26px;height:26px}
.pill.icon{width:58px;padding:0;justify-content:center}
.pill.icon svg{width:30px;height:30px}
.pill.on{background:#FFFFFF;color:#111113;transform:scale(1.08)}

/* app drawer */
#drawer{position:absolute;inset:0;background:rgba(7,10,16,.94);opacity:0;visibility:hidden;transition:opacity 260ms,visibility 0s 260ms}
#drawer.on{opacity:1;visibility:visible;transition:opacity 260ms}
#drawer h2{position:absolute;left:96px;top:64px;margin:0;font-size:52px;font-weight:650;letter-spacing:-.02em;color:#fff}
#dhint{position:absolute;right:97px;top:82px;font-size:24px;font-weight:500;color:rgba(255,255,255,.55)}
#dview{position:absolute;left:0;top:170px;width:1920px;height:910px;overflow:hidden}
#dgrid{position:absolute;left:96px;top:24px;width:1728px;display:grid;grid-template-columns:repeat(6,254px);column-gap:40px;row-gap:34px;transition:transform 260ms ease}
.app{display:flex;flex-direction:column;align-items:center;gap:12px}
.app .ban{width:254px;height:143px;border-radius:20px;background:#1C1C1E;overflow:hidden;display:flex;align-items:center;justify-content:center;
  transition:transform 200ms cubic-bezier(.2,.9,.25,1.1),box-shadow 200ms}
.app .ban img.b{width:100%;height:100%;object-fit:cover}
.app .ban img.i{width:84px;height:84px}
.app span{font-size:22px;font-weight:600;color:rgba(255,255,255,.7);max-width:254px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.on .ban{transform:scale(1.1);box-shadow:0 0 0 4px #fff,0 18px 40px rgba(0,0,0,.5)}
.app.on span{color:#fff}
#dempty{position:absolute;left:96px;top:200px;font-size:30px;color:rgba(255,255,255,.6)}

#toast{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:26px;font-weight:500;opacity:0;transition:opacity 250ms;pointer-events:none}
#toast.on{opacity:.9}
/* ============ feel: microinteractions, reveal, live weather, needle drop ============
   One easing for everything (from CleanFrame); transform/opacity only, so the TV's GPU composites it. */
#stage{--ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.3,1.35,.45,1)}
/* press: the focused tile dips and springs back on OK */
.slot.press .tile{animation:fxpress 300ms var(--ease)}
@keyframes fxpress{0%{transform:translateY(-12px) scale(1.14)}40%{transform:translateY(-6px) scale(1.04)}100%{transform:translateY(-12px) scale(1.14)}}
/* nudge: pushing past either end of the row bumps the tile instead of wrapping */
.slot.nudge-r .tile{animation:fxnudgeR 340ms var(--ease)}
.slot.nudge-l .tile{animation:fxnudgeL 340ms var(--ease)}
@keyframes fxnudgeR{0%,100%{transform:translateY(-12px) scale(1.14)}35%{transform:translate(16px,-12px) scale(1.14)}70%{transform:translate(-4px,-12px) scale(1.14)}}
@keyframes fxnudgeL{0%,100%{transform:translateY(-12px) scale(1.14)}35%{transform:translate(-16px,-12px) scale(1.14)}70%{transform:translate(4px,-12px) scale(1.14)}}
/* launch: the tile swells and the screen dims into the app */
#fxfade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 280ms var(--ease)}
#stage.leaving #fxfade{opacity:1}
#stage.leaving .slot.on .tile{transform:translateY(-12px) scale(1.32);transition:transform 280ms var(--ease)}
/* reveal: greeting words rise in one by one; cards and tiles assemble (power-on, long absence) */
#msg .w{display:inline-block;opacity:0;transform:translateY(18px);animation:fxword 520ms var(--ease) forwards}
@keyframes fxword{to{opacity:1;transform:none}}
#stage.reveal .card{animation:fxcard 700ms var(--ease) both}
#stage.reveal #wx{animation-delay:120ms}
#stage.reveal .slot,#stage.cascade .slot{animation:fxrise 620ms var(--ease) both}
#stage.reveal #top{animation:fxfadein 600ms var(--ease) 500ms both}
@keyframes fxcard{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes fxrise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes fxfadein{from{opacity:0}to{opacity:1}}
/* clock: digits roll over on the minute */
#time.tick,#m-time.tick{display:inline-block;animation:fxtick 420ms var(--ease)}
@keyframes fxtick{from{opacity:0;transform:translateY(28%)}to{opacity:1;transform:none}}
/* live weather icons */
.wi path,.wi circle{transform-box:fill-box}
.wi-rain path:nth-child(2){animation:fxrain 1.1s linear infinite}
@keyframes fxrain{0%{opacity:0;transform:translateY(-5px)}30%{opacity:1}100%{opacity:0;transform:translateY(6px)}}
.wi-snow path:nth-child(2){animation:fxrain 2.4s linear infinite}
.wi-clear.day path{transform-origin:center;animation:fxspin 24s linear infinite}
.wi-clear.night path{animation:fxglow 4s ease-in-out infinite alternate}
@keyframes fxglow{from{opacity:.75}to{opacity:1}}
.wi-cloud path,.wi-haze path:first-child,.wi-storm path:first-child{animation:fxdrift 6s ease-in-out infinite alternate}
@keyframes fxdrift{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
.wi-storm path:nth-child(2){animation:fxflash 5s steps(1) infinite}
@keyframes fxflash{0%,88%,94%{opacity:1}90%,96%{opacity:.2}}
@keyframes fxspin{to{transform:rotate(360deg)}}
/* needle drop: the tonearm swings on and lifts off; the record spins up / down in JS */
.marm{transform-origin:34px 34px;transform:rotate(-24deg);transition:transform 900ms var(--spring),translate 520ms cubic-bezier(.2,.7,.2,1)}
.marm.down{transform:rotate(0deg)}
#msaver.paused .mvinyl{animation-play-state:running}   /* speed is eased in JS (playbackRate), not snapped */

</style>
</head>
<body>
<div id="stage" class="">
  <img class="bg" id="bg-morning" src="assets/bg-morning.jpg" alt="">
  <img class="bg" id="bg-evening" src="assets/bg-evening.jpg" alt="">
  <img class="bg" id="bg-night" src="assets/bg-night.jpg" alt="">
  <div id="glow" aria-hidden="true"></div>

  <h1 id="msg"></h1>

  <div class="card" id="clock">
    <div class="row"><span id="time">--:--</span><span id="ampm"></span></div>
    <span id="date"></span>
  </div>

  <div class="card" id="wx">
    <div class="wxtop"><span id="city">New Delhi</span><span id="wxicon"></span></div>
    <span id="temp">–°</span>
    <div class="wxbot"><span id="cond"></span><span id="feels"></span></div>
  </div>

  <nav id="apps" aria-label="Apps">
    <div class="slot" style="left:98px">
      <img class="sh" src="assets/tile-shadow.png" alt="">
      <button class="tile" aria-label="YouTube"><span><svg role="img" aria-label="YouTube" width="104" height="73" viewBox="0 3.3 24 17.4" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"></path></svg></span></button>
      <span class="lbl">YouTube</span>
    </div>
    <div class="slot" style="left:392px">
      <img class="sh" src="assets/tile-shadow.png" alt="">
      <button class="tile" aria-label="Netflix"><span><svg role="img" aria-label="Netflix" width="56" height="96" viewBox="4.5 0 15 24" fill="currentColor"><path d="m5.398 0 8.348 23.602c2.346.059 4.856.398 4.856.398L10.113 0H5.398zm8.489 0v9.172l4.715 13.33V0h-4.715zM5.398 1.5V24c1.873-.225 2.81-.312 4.715-.398V14.83L5.398 1.5z"></path></svg></span></button>
      <span class="lbl">Netflix</span>
    </div>
    <div class="slot" style="left:686px">
      <img class="sh" src="assets/tile-shadow.png" alt="">
      <button class="tile" aria-label="JioHotstar"><span><img class="lg-n" src="assets/hotstar-light.png" alt="JioHotstar" style="width:150px;height:84px;object-fit:contain"><img class="lg-f" src="assets/hotstar-dark.png" alt="" style="width:150px;height:84px;object-fit:contain"></span></button>
      <span class="lbl">JioHotstar</span>
    </div>

// Measure the layout viewport, not window.innerWidth: Android TV's WebView (no wide viewport) reports
// innerWidth in device pixels (1920) while the page lays out at 960x540 CSS px (devicePixelRatio 2),

function fit() {

  var w = el.clientWidth || window.innerWidth, h = el.clientHeight || window.innerHeight;
  var s = Math.min(w / 1920, h / 1080);

}
window.addEventListener("resize", fit);

    else if (R) { setDrawerFocus(dcur + 1); sfx("move"); }

    var c = document.createElement("canvas"); c.width = c.height = 24;
    var g = c.getContext("2d"); g.drawImage(img, 0, 0, 24, 24);

    if (!hues.length || hues[0].s < 0.22) { done(null); return; }

  var stops = [col("--m1"), col("--m2"), col("--m3"), col("--m4"), col("--m5"), col("--m3"), col("--m1")];
  var c = document.createElement("canvas"); c.width = c.height = 512;
  var g = c.getContext("2d");
  if (g.createConicGradient) {
    var grad = g.createConicGradient(-Math.PI / 2, 256, 256);        // from 0deg = 12 o'clock, like CSS
    stops.forEach(function (s, i) { grad.addColorStop(i / (stops.length - 1), s); });
    g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
    img.src = c.toDataURL("image/png");
  } else {
    img.removeAttribute("src");
    img.style.background = "conic-gradient(from 0deg," + stops.join(",") + ")";   // very old WebView: paint it
  }
}
paintGlow();

function setPlayIcons(playing) {
  [mBtns[1]].forEach(function (b) {
    b.querySelector(".pp").setAttribute("d", playing ? PAUSE_D : PLAY_D);
    b.querySelector(".pp").setAttribute("fill", playing ? "none" : "currentColor");
    b.querySelector(".pp").setAttribute("stroke-width", playing ? "7" : "4");
    b.setAttribute("aria-label", playing ? "Pause" : "Play");
  });
}

window.onNowPlaying = function (s) {
  var prevKey = M.key, wasPlaying = musicPlaying();
  M.s = s; M.stamp = Date.now();
  var active = musicActive(), playing = musicPlaying();
  msaver.classList.toggle("paused", !playing);
  if (msaver.classList.contains("on") && musicActive() && wasPlaying !== playing) { if (playing) needleDown(true); else needleUp(); }
  if (!active) {                                        // music gone: back to home (or the plain saver if idle)
    M.key = "";
    if (msaver.classList.contains("on")) { hideControls(); msaver.classList.remove("on"); if (idle) saver.classList.add("on"); }
    stopLoop(); return;
  }
  var app = s.app || "Music";
  document.getElementById("m-title").textContent = s.title || "";
  document.getElementById("m-artist").textContent = s.artist || "";
  document.getElementById("m-src").textContent = "Now playing on " + app;
  document.getElementById("m-src2").textContent = "Now playing on " + app;
  document.getElementById("m-dur").textContent = mmss(s.duration);
  setPlayIcons(playing);
  if (s.art && s.art !== M.art) {
    M.art = s.art;
    document.getElementById("m-label").style.backgroundImage = 'url("' + s.art.replace(/"/g, "%22") + '")';   // quoted: data URLs hold ( )
    var img = new Image();
    img.onload = function () { coverPalette(img, applyPalette); };
    img.src = s.art;
  }
  M.key = (s.title || "") + "|" + (s.artist || "");
  // whenever music is playing, the vinyl screen: when it starts or resumes, and when a new track begins
  if (playing && (!wasPlaying || M.key !== prevKey)) showMusicSaver();
  startLoop();
};
// the Android shell calls this when the home screen comes back to the front
window.onResumeHome = function () { returnHome(); if (musicPlaying()) showMusicSaver(); };
window.onLeaveHome = function () { awaySince = Date.now(); };

function mediaCmd(cmd) {
  if (window.Android && typeof window.Android.media === "function") window.Android.media(cmd);
  else toast("Prototype: " + cmd);
  if (cmd === "toggle" && M.s) {                         // show the change at once; Android's own update follows
    var n = Object.assign({}, M.s);                      // a new state, so onNowPlaying sees playing -> paused
    n.position += (Date.now() - M.stamp) * (n.speed || 0); n.playing = !n.playing; n.speed = n.playing ? 1 : 0;
    window.onNowPlaying(n);
  }
}

/* ---- music screensaver ---- */
function showMusicSaver() {
  var was = msaver.classList.contains("on");
  saver.classList.remove("on"); msaver.classList.add("on"); hideControls(); startLoop();
  if (!was) { needleReset(); if (musicPlaying()) setTimeout(function () { needleDown(true); }, 350); }   // the needle drop
}
function showControls() {
  M.ctl = true; msaver.classList.add("ctl"); focusMusicBtn(1); armControlsTimer();
}
function hideControls() { M.ctl = false; msaver.classList.remove("ctl"); mBtns.forEach(function (b) { b.classList.remove("on"); }); clearTimeout(M.ctlT); }
function armControlsTimer() { clearTimeout(M.ctlT); M.ctlT = setTimeout(hideControls, 6000); }
function focusMusicBtn(i) { M.mfocus = Math.max(0, Math.min(2, i)); mBtns.forEach(function (b, n) { b.classList.toggle("on", n === M.mfocus); }); }
function leaveMusic() { hideControls(); msaver.classList.remove("on"); wake(); }
mBtns.forEach(function (b) { b.addEventListener("click", function () { mediaCmd(b.getAttribute("data-cmd")); armControlsTimer(); }); });

// runs before the home screen's key handler (capture phase) so the saver gets keys first
document.addEventListener("keydown", function (e) {
  if (!msaver.classList.contains("on")) return;
  e.preventDefault(); e.stopPropagation();
  var k = e.key, c = e.keyCode;
  var L = k === "ArrowLeft" || c === 21, R = k === "ArrowRight" || c === 22;
  var OK = k === "Enter" || k === " " || c === 23 || c === 66, BACK = k === "Escape" || k === "Backspace" || k === "GoBack" || c === 4;
  if (BACK) { sfx("back"); leaveMusic(); return; }
  if (!M.ctl) { sfx("click"); showControls(); return; }  // first key just shows the controls
  armControlsTimer();
  if (L) { focusMusicBtn(M.mfocus - 1); sfx("move"); }
  else if (R) { focusMusicBtn(M.mfocus + 1); sfx("move"); }
  else if (OK) { sfx("select"); mediaCmd(mBtns[M.mfocus].getAttribute("data-cmd")); }
}, true);
document.addEventListener("mousemove", function () { if (msaver.classList.contains("on") && !M.ctl) showControls(); }, true);

/* ---- per-frame: progress bars, clock, and the beat (live bass or the design's 0.47 s) ---- */
function startLoop() { if (!M.raf) M.raf = requestAnimationFrame(loop); }
function stopLoop() { if (M.raf) cancelAnimationFrame(M.raf); M.raf = 0; M.level = 0; }
var mGlowWrap = msaver.querySelector(".mglowwrap"), mMask = msaver.querySelector(".mmask"), mVwrap = msaver.querySelector(".mvwrap");
function loop(t) {
  M.raf = 0;
  var s = M.s; if (!musicActive()) return;
  var pos = s.position + (Date.now() - M.stamp) * (s.speed || 0), frac = s.duration > 0 ? Math.max(0, Math.min(1, pos / s.duration)) : 0;
  var sc = "scaleX(" + frac.toFixed(4) + ")";
  document.getElementById("m-bar").style.transform = sc;
  document.getElementById("m-pos").textContent = mmss(Math.min(pos, s.duration || pos));

  var onSaver = msaver.classList.contains("on");
  if (onSaver) {
    var ft = fmtTime(nowDate());
    document.getElementById("m-time").textContent = ft.t; document.getElementById("m-ampm").textContent = ft.ap;
    var live = false, raw = 0;
    if (musicPlaying() && s.reactive && window.Android && typeof window.Android.level === "function") {
      raw = +window.Android.level() || 0;
      if (raw > 0.02) { live = true; M.quiet = 0; } else if (!M.quiet) M.quiet = t;
      if (M.quiet && t - M.quiet < 2500) live = true;      // a gap between songs isn't "no visualizer"
    }
    msaver.classList.toggle("beat", !live);              // no live bass: the design's CSS beat
    if (live) {
      M.level += (raw - M.level) * (raw > M.level ? 0.6 : 0.15);   // fast attack, slow release
      var L = M.level;
      mGlowWrap.style.opacity = (0.6 + 0.4 * L).toFixed(3);
      mMask.style.transform = "scale(" + (1 - 0.007 * L).toFixed(4) + "," + (1 - 0.012 * L).toFixed(4) + ")";
      mVwrap.style.transform = "scale(" + (1 + 0.025 * L).toFixed(4) + ")";
    } else { mGlowWrap.style.opacity = ""; mMask.style.transform = ""; mVwrap.style.transform = ""; }
  }
  M.raf = requestAnimationFrame(loop);
}

if (Q.get("np")) {
  var demoArt = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b3d"/><stop offset=".55" stop-color="#e0607e"/><stop offset="1" stop-color="#5a2b8f"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><circle cx="210" cy="90" r="46" fill="#f7d9a8"/></svg>');
  setTimeout(function () { window.onNowPlaying({ active: true, playing: true, title: "Night Drive", artist: "Demo Artist", album: "Preview",
    app: "Spotify", art: demoArt, position: 88000, duration: 211000, speed: 1, reactive: false }); }, 300);
}

/* ============================ feel: sound, microinteractions, reveal, needle drop ============================ */

/* ---- sound: tiny synthesized cues (Web Audio, no files). SOUNDS / SOUND_VOLUME live in the CONFIG block. ---- */
var AC = null, fxLast = {};
function audio() {
  if (!SOUNDS) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
  return AC;
}
function vol() { return SOUND_VOLUME * (typeof musicPlaying === "function" && musicPlaying() ? 0.5 : 1); }
function tone(f, dur, type, v, at, f2) {
  var a = audio(); if (!a) return;
  var t = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v * vol()), t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, v, at, fLo, fHi, q) {
  var a = audio(); if (!a) return;
  var t = a.currentTime + (at || 0), n = Math.ceil(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = "bandpass"; f.Q.value = q || 1.2;
  f.frequency.setValueAtTime(fLo, t); if (fHi) f.frequency.exponentialRampToValueAtTime(fHi, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v * vol()), t + dur * 0.25);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t + dur + 0.02);
}
function sfx(name) {
  var now = Date.now();
  if (fxLast[name] && now - fxLast[name] < 45) return;           // held keys: no machine-gun ticks
  fxLast[name] = now;
  switch (name) {
    case "move":   tone(1650, 0.035, "triangle", 0.05); break;                       // focus moves
    case "edge":   tone(190, 0.14, "sine", 0.16, 0, 110); break;                     // end of the row
    case "select": tone(660, 0.09, "triangle", 0.09); tone(990, 0.16, "triangle", 0.08, 0.055); break;
    case "back":   tone(740, 0.11, "sine", 0.07, 0, 440); break;
    case "open":   noise(0.26, 0.05, 0, 500, 1800, 0.9); tone(880, 0.12, "sine", 0.04, 0.05); break;
    case "wake":   tone(523, 0.18, "sine", 0.06); tone(784, 0.26, "sine", 0.05, 0.09); break;
    case "hello":  [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.5, "sine", 0.05, i * 0.11); }); break;
    case "click":  tone(1200, 0.025, "square", 0.025); break;
    case "needle":                                                                  // needle drop: thump + crackle
      tone(70, 0.22, "sine", 0.18, 0, 45);
      for (var i = 0; i < 9; i++) noise(0.012, 0.09 + Math.random() * 0.08, 0.05 + Math.random() * 0.55, 2500 + Math.random() * 3000, 0, 2.5);
      break;
    case "lift":   tone(300, 0.12, "sine", 0.05, 0, 520); break;
  }
}

/* ---- microinteractions ---- */
function flash(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(function () { el.classList.remove(cls); }, ms); }
function pressTile(i) { flash(slots[i], "press", 320); }
function nudge(dir) { sfx("edge"); flash(slots[cur], dir > 0 ? "nudge-r" : "nudge-l", 360); }
/* dim into the app; if nothing takes over (app missing, browser preview) come back */
var leaveT = 0;
function leaveTo(fn) {
  stage.classList.add("leaving");
  setTimeout(fn, 240);
  clearTimeout(leaveT);
  leaveT = setTimeout(function () { stage.classList.remove("leaving"); }, window.Android ? 2500 : 700);
}

/* ---- greeting writes itself in, word by word ---- */
function setGreeting(text, animate) {
  var el = document.getElementById("msg");
  if (el.textContent.trim() === text.trim() && !animate) return;    // same words (e.g. a weather refresh): leave the animation alone
  if (!animate) { el.textContent = text; return; }
  el.textContent = "";
  text.split(" ").forEach(function (w, i) {
    var s = document.createElement("span"); s.className = "w"; s.textContent = w;
    s.style.animationDelay = (i * 55) + "ms";
    el.appendChild(s); el.appendChild(document.createTextNode(" "));
  });
}
/* ---- clock digits roll over on the minute ---- */
function setTimeText(id, t) {
  var el = document.getElementById(id);
  if (el.textContent === t) return;
  var first = el.textContent === "--:--" || el.textContent === "";
  el.textContent = t;
  if (!first) flash(el, "tick", 440);
}

/* ---- power-on / long-absence reveal, and the quieter return from an app ---- */
var awaySince = 0;
function reveal(withSound) {
  stage.classList.remove("reveal", "cascade"); void stage.offsetWidth;
  stage.classList.add("reveal");
  slots.forEach(function (s, i) { s.style.animationDelay = (260 + i * 60) + "ms"; });
  setGreeting(document.getElementById("msg").textContent, true);
  if (withSound) setTimeout(function () { sfx("hello"); }, 150);
  setTimeout(function () { stage.classList.remove("reveal"); slots.forEach(function (s) { s.style.animationDelay = ""; }); }, 1800);
}
function returnHome() {
  clearTimeout(leaveT);
  stage.classList.remove("leaving");
  var away = awaySince ? Date.now() - awaySince : 0;
  awaySince = 0;
  if (away > 2 * 3600 * 1000) { render(true); reveal(true); return; }   // been a while: greet properly
  stage.classList.remove("cascade"); void stage.offsetWidth;
  stage.classList.add("cascade");
  slots.forEach(function (s, i) { s.style.animationDelay = (Math.abs(i - cur) * 45) + "ms"; });   // ripples out from where you were
  setTimeout(function () { stage.classList.remove("cascade"); slots.forEach(function (s) { s.style.animationDelay = ""; }); }, 1200);
  setFocus(cur);                                                         // focus stays on the app you left
}
document.addEventListener("visibilitychange", function () { if (document.hidden) awaySince = Date.now(); });

/* ---- needle drop: arm swings on, record spins up; pause lifts the arm and spins it down ---- */
var marm = msaver.querySelector(".marm"), mvinyl = msaver.querySelector(".mvinyl"), spinRaf = 0;
function spinTo(target, ms) {
  var anim = mvinyl.getAnimations ? mvinyl.getAnimations()[0] : null;
  if (!anim) return;
  cancelAnimationFrame(spinRaf); clearTimeout(spinTo.done);
  var from = anim.playbackRate, t0 = performance.now();
  // frames can stall (hidden page): make sure the record still ends up at the right speed
  spinTo.done = setTimeout(function () { cancelAnimationFrame(spinRaf); anim.playbackRate = Math.max(0.0001, target); }, ms + 80);
  (function step(t) {
    var k = Math.min(1, (t - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    anim.playbackRate = Math.max(0.0001, from + (target - from) * e);
    if (k < 1) spinRaf = requestAnimationFrame(step);
  })(t0);
}
function needleDown(withSound) {
  marm.classList.add("down");
  if (withSound) setTimeout(function () { sfx("needle"); }, 560);       // when the needle lands
  setTimeout(function () { spinTo(1, 1400); }, 450);
}
function needleUp() { marm.classList.remove("down"); sfx("lift"); spinTo(0.0001, 1600); }
function needleReset() {                                               // off-screen: arm parked, record still
  marm.classList.remove("down");
  var anim = mvinyl.getAnimations ? mvinyl.getAnimations()[0] : null;
  if (anim) anim.playbackRate = 0.0001;
}

/* ============================ boot ============================ */
loadCachedWx(); render(true); fetchWx();
setInterval(function () { render(false); }, 1000);
setInterval(fetchWx, WEATHER_REFRESH_MIN * 60 * 1000);
setFocus(0); wake(); reveal(true);
</script>
