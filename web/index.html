<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Inter";src:url("assets/inter.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{cursor:default}
button{all:unset;box-sizing:border-box}

/* The design lives on a fixed 1920x1080 stage that is scaled to whatever the screen reports. */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
  font-family:Inter,system-ui,sans-serif;font-optical-sizing:auto;
  --fg:#FFFFFF;--fg2:rgba(255,255,255,.78);--card:rgba(0,0,0,.26)}
#stage.light{--fg:#1D1D1F;--fg2:rgba(29,29,31,.72);--card:rgba(255,255,255,.46)}
#stage{color:var(--fg)}

/* backgrounds: stacked, cross-faded. opacity only, so it is cheap on a weak GPU */
.bg{position:absolute;inset:0;width:1920px;height:1080px;opacity:0;transition:opacity 1400ms ease}
.bg.on{opacity:1}

#msg{position:absolute;left:96px;top:110px;width:1160px;margin:0;font-size:88px;font-weight:650;line-height:1.04;letter-spacing:-.03em;transition:opacity 400ms}
.card{position:absolute;left:1383px;width:440px;border-radius:36px;background:var(--card);padding:28px 34px;display:flex;flex-direction:column;justify-content:space-between}
#clock{top:117px;height:206px}
#wx{top:343px;height:290px}
.row{display:flex;align-items:baseline;gap:10px}
#time{font-size:108px;font-weight:250;line-height:.85;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#ampm{font-size:36px;font-weight:500}
#date,#feels{font-size:28px;font-weight:500;color:var(--fg2)}
.wxtop{display:flex;justify-content:space-between;align-items:center}
#city{font-size:30px;font-weight:600}
#temp{font-size:104px;font-weight:250;line-height:.85;letter-spacing:-.03em}
#cond{font-size:30px;font-weight:600}
.wxbot{display:flex;flex-direction:column;gap:4px}

/* app tiles */
.slot{position:absolute;top:748px;width:254px;height:152px}
.sh{position:absolute;left:-83px;top:-40px;width:420px;height:290px;opacity:0;transition:opacity 220ms ease-out;pointer-events:none}
.tile{position:absolute;inset:0;border-radius:28px;background:#1C1C1E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transform-origin:50% 60%;transition:transform 220ms cubic-bezier(.2,.9,.25,1.1),background 160ms,color 160ms}
.tile.blk{background:#0B0A0E}
.tile>span{display:flex;align-items:center;justify-content:center;color:inherit}
.lbl{position:absolute;left:-40px;width:334px;top:194px;text-align:center;font-size:30px;font-weight:600;opacity:0;transition:opacity 220ms}
.slot.on .tile{transform:translateY(-12px) scale(1.14);background:#FFFFFF;color:#111113}
.slot.on .sh,.slot.on .lbl{opacity:1}
.slot.on .lbl{color:var(--fg)}
.lg-f{display:none}
.slot.on .lg-n{display:none}
.slot.on .lg-f{display:block}

/* screensaver */
#saver{position:absolute;inset:0;background:#070B12;color:#fff;opacity:0;visibility:hidden;transition:opacity 900ms ease,visibility 0s 900ms}
#saver.on{opacity:1;visibility:visible;transition:opacity 900ms ease}
#saver img{position:absolute;inset:0;width:1920px;height:1080px}
#saver.on img{animation:kb 90s ease-in-out infinite alternate}
#drift{position:absolute;left:130px;bottom:120px;display:flex;flex-direction:column;gap:22px}
#saver.on #drift{animation:drift 180s linear infinite alternate}
#stime{font-size:220px;font-weight:250;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#sampm{font-size:60px;font-weight:400}
#smsg{margin:0;font-size:52px;font-weight:600;letter-spacing:-.02em}
#swx{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:500;color:rgba(255,255,255,.78)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(36px,-28px)}}

#toast{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:26px;font-weight:500;opacity:0;transition:opacity 250ms;pointer-events:none}
#toast.on{opacity:.9}
</style>
</head>

<script>
"use strict";
/* ============================ CONFIG: the bits you edit ============================ */
var NAME = "Arnav";
var CITY = { name: "New Delhi", lat: 28.6139, lon: 77.2090 };
var IDLE_SECONDS = 180;            // screensaver after this long with no key press
var WEATHER_REFRESH_MIN = 20;

// Package names are what the launcher uses to open each app. The first one that is installed wins.
// Confirm on your TV:  adb shell pm list packages | grep -i <name>
// All six verified 2026-11-24 on HKC 4K 9676 Google TV (Android 14): each is installed and
// resolves a LEANBACK_LAUNCHER activity.
var APPS = [
  { name: "YouTube",     pkgs: ["com.google.android.youtube.tv"] },
  { name: "Netflix",     pkgs: ["com.netflix.ninja"] },
  { name: "JioHotstar",  pkgs: ["in.startv.hotstar"] },
  { name: "Prime Video", pkgs: ["com.amazon.amazonvideo.livingroom"] },
  { name: "ZEE5",        pkgs: ["com.graymatrix.did"] },
  { name: "Sony LIV",    pkgs: ["com.sonyliv"] }
];

// The voice of the home screen. Only the three lines marked (yours) come from your design;
// every other line is a placeholder I wrote, so replace them with lines that sound like you.
// Keys: period.condition. Periods: morning, afternoon, evening, late. Conditions: clear, cloud, haze, rain, snow, storm, any.
// {name} is replaced with NAME.
var MESSAGES = {
  "morning.haze":   ["Morning, {name}. Hazy out, but the day’s wide open."],            // (yours)
  "morning.clear":  ["Morning, {name}. Clear skies, no excuses."],
  "morning.rain":   ["Morning, {name}. Rain at the window. Take it slow."],
  "morning.any":    ["Morning, {name}. Take your time."],
  "afternoon.rain": ["Rain this afternoon, {name}. A good excuse to stay in."],
  "afternoon.haze": ["Hazy afternoon, {name}. Stay in, stream on."],
  "afternoon.any":  ["Afternoon, {name}. Something good to watch?"],
  "evening.rain":   ["Rainy evening, {name}. A good one to stay in."],                   // (yours)
  "evening.haze":   ["Hazy evening, {name}. Settle in."],
  "evening.clear":  ["Clear evening, {name}. Your couch is waiting."],
  "evening.any":    ["Evening, {name}. What are we watching?"],
  "late.any":       ["Still up, {name}? One episode, then sleep."]
};
// Late-night screensaver line, e.g. "Past one, Arnav. One more, then sleep?"   (yours)
var SAVER_LATE = "Past {hour}, {name}. One more, then sleep?";
var SAVER_OTHER = { morning: "Good morning, {name}.", afternoon: "Afternoon, {name}.", evening: "Evening, {name}." };

/* ============================ stage scaling ============================ */
var stage = document.getElementById("stage");
// Measure the layout viewport, not window.innerWidth: Android TV's WebView (no wide viewport) reports
// innerWidth in device pixels (1920) while the page lays out at 960x540 CSS px (devicePixelRatio 2),
// which left the stage at scale(1) with only its top-left quarter on screen.
function fit() {
  var el = document.documentElement;
  var w = el.clientWidth || window.innerWidth, h = el.clientHeight || window.innerHeight;
  var s = Math.min(w / 1920, h / 1080);
  stage.style.transform = "translate(" + ((w - 1920 * s) / 2) + "px," + ((h - 1080 * s) / 2) + "px) scale(" + s + ")";
}
window.addEventListener("resize", fit);
if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
fit();

/* ============================ debug overrides (for testing in a browser) ============================
   ?t=19:42   fake the time      ?wx=61   fake a WMO weather code      ?idle=5   screensaver after 5 s */
var Q = new URLSearchParams(location.search);
function nowDate() {
  var d = new Date(), t = Q.get("t");
  if (t && /^\d{1,2}:\d{2}$/.test(t)) { var p = t.split(":"); d.setHours(+p[0], +p[1], 0, 0); }
  return d;
}
if (Q.get("idle")) IDLE_SECONDS = +Q.get("idle");

/* ============================ time of day ============================ */
function period(h) { return h >= 5 && h < 12 ? "morning" : h < 17 && h >= 12 ? "afternoon" : h >= 17 && h < 22 ? "evening" : "late"; }
var HOURWORD = ["midnight","one","two","three","four","five","six","seven","eight","nine","ten","eleven","noon","one","two","three","four","five","six","seven","eight","nine","ten","eleven"];
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtTime(d) { var h = d.getHours() % 12 || 12, m = d.getMinutes(); return { t: h + ":" + (m < 10 ? "0" : "") + m, ap: d.getHours() < 12 ? "AM" : "PM" }; }

/* ============================ weather (Open-Meteo, no API key) ============================ */
var WMO = {
  0:["Clear","clear"],1:["Mostly Clear","clear"],2:["Partly Cloudy","cloud"],3:["Overcast","cloud"],
  45:["Hazy","haze"],48:["Hazy","haze"],
  51:["Light Drizzle","rain"],53:["Drizzle","rain"],55:["Heavy Drizzle","rain"],56:["Freezing Drizzle","rain"],57:["Freezing Drizzle","rain"],
  61:["Light Rain","rain"],63:["Rain","rain"],65:["Heavy Rain","rain"],66:["Freezing Rain","rain"],67:["Freezing Rain","rain"],
  71:["Light Snow","snow"],73:["Snow","snow"],75:["Heavy Snow","snow"],77:["Snow Grains","snow"],
  80:["Showers","rain"],81:["Showers","rain"],82:["Heavy Showers","rain"],85:["Snow Showers","snow"],86:["Snow Showers","snow"],
  95:["Thunderstorm","storm"],96:["Thunderstorm","storm"],99:["Thunderstorm","storm"]
};
var CLOUD = "M16 34 C6 34 6 20 17 20 C19 10 33 8 37 18 C46 16 50 26 46 34 Z";
function icon(kind, night, size) {
  var body;
  if (kind === "clear") body = night ? '<path d="M36 10 A18 18 0 1 0 46 36 A14 14 0 1 1 36 10 Z"/>'
    : '<circle cx="28" cy="28" r="9"/><path d="M28 7v6M28 43v6M7 28h6M43 28h6M13 13l4 4M39 39l4 4M43 13l-4 4M17 39l-4 4"/>';
  else if (kind === "cloud") body = '<path d="' + CLOUD + '" transform="translate(0,4)"/>';
  else if (kind === "haze") body = '<path d="' + CLOUD + '"/><path d="M14 42h28M20 49h22"/>';
  else if (kind === "snow") body = '<path d="' + CLOUD + '"/><path d="M20 44v.1M30 44v.1M40 44v.1M25 50v.1M35 50v.1"/>';
  else if (kind === "storm") body = '<path d="' + CLOUD + '"/><path d="M30 38l-6 8h8l-4 8"/>';
  else body = '<path d="' + CLOUD + '"/><path d="M20 42 L17 50 M30 42 L27 50 M40 42 L37 50"/>';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
}
var wx = null; // {temp, feels, code}
function loadCachedWx() { try { var c = JSON.parse(localStorage.getItem("wx") || "null"); if (c) wx = c.v; } catch (e) {} }
function fetchWx() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + CITY.lat + "&longitude=" + CITY.lon +
            "&current=temperature_2m,apparent_temperature,weather_code&timezone=auto";
  fetch(url).then(function (r) { return r.json(); }).then(function (j) {
    var c = j.current; wx = { temp: Math.round(c.temperature_2m), feels: Math.round(c.apparent_temperature), code: c.weather_code };
    try { localStorage.setItem("wx", JSON.stringify({ t: Date.now(), v: wx })); } catch (e) {}
    render(true);
  }).catch(function () { /* keep whatever we have; the screen never goes blank */ });
}

/* ============================ rendering ============================ */
function pick(list, seed) { return list[seed % list.length]; }
function messageFor(per, cond, seed) {
  var l = MESSAGES[per + "." + cond] || MESSAGES[per + ".any"] || ["Hello, {name}."];
  return pick(l, seed).replace(/\{name\}/g, NAME);
}
var lastMsgKey = "";
function render(force) {
  var d = nowDate(), per = period(d.getHours()), ft = fmtTime(d);
  var code = Q.get("wx") !== null ? +Q.get("wx") : (wx ? wx.code : null);
  var info = code !== null && WMO[code] ? WMO[code] : null;
  var cond = info ? info[1] : "any", night = per === "late" || per === "evening" && d.getHours() >= 19;

  document.getElementById("time").textContent = ft.t;
  document.getElementById("ampm").textContent = ft.ap;
  document.getElementById("date").textContent = DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
  document.getElementById("stime").textContent = ft.t;
  document.getElementById("sampm").textContent = ft.ap;

  var temp = wx ? wx.temp + "°" : "–°", feels = wx ? "Feels like " + wx.feels + "°" : "";
  document.getElementById("temp").textContent = temp;
  document.getElementById("cond").textContent = info ? info[0] : "Weather unavailable";
  document.getElementById("feels").textContent = feels;
  document.getElementById("city").textContent = CITY.name;
  document.getElementById("wxicon").innerHTML = info ? icon(info[1], night, 44) : "";
  document.getElementById("swxicon").innerHTML = icon(info ? info[1] : "clear", true, 36);
  document.getElementById("swxtext").textContent = CITY.name + (wx ? " · " + temp + " " + (info ? info[0] : "") : "");

  // theme + background follow the time of day
  var bg = per === "morning" || per === "afternoon" ? "morning" : per === "evening" ? "evening" : "night";
  ["morning","evening","night"].forEach(function (n) { document.getElementById("bg-" + n).classList.toggle("on", n === bg); });
  stage.classList.toggle("light", bg === "morning");

  // greeting only changes when the situation changes, so it does not flicker every minute
  var key = per + "." + cond;
  if (force || key !== lastMsgKey) {
    lastMsgKey = key;
    document.getElementById("msg").textContent = messageFor(per, cond, d.getDate());
  }
  var sm = per === "late" ? SAVER_LATE.replace("{hour}", HOURWORD[d.getHours()]).replace(/\{name\}/g, NAME)
                          : (SAVER_OTHER[per] || "Hello, {name}.").replace(/\{name\}/g, NAME);
  document.getElementById("smsg").textContent = sm;
}

/* ============================ tiles + D-pad focus ============================ */
var slots = [].slice.call(document.querySelectorAll(".slot"));
var cur = 0;
function setFocus(i) {
  cur = Math.max(0, Math.min(slots.length - 1, i));
  slots.forEach(function (s, n) { s.classList.toggle("on", n === cur); });
  var b = slots[cur].querySelector(".tile"); if (document.activeElement !== b) b.focus({ preventScroll: true });
}
function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(function () { el.classList.remove("on"); }, 2200); }
function launch(i) {
  var a = APPS[i];
  if (window.Android && typeof window.Android.launch === "function") { window.Android.launch(JSON.stringify(a.pkgs)); }
  else toast("Prototype: this would open " + a.name);
}
slots.forEach(function (s, i) {
  var b = s.querySelector(".tile");
  b.addEventListener("focus", function () { cur = i; slots.forEach(function (x, n) { x.classList.toggle("on", n === i); }); });
  b.addEventListener("click", function () { wake(); launch(i); });
  b.addEventListener("mouseenter", function () { if (!idle) setFocus(i); });
});

/* ============================ idle / screensaver ============================ */
var idle = false, idleT;
var saver = document.getElementById("saver");
function sleep() { idle = true; saver.classList.add("on"); }
function wake() { var was = idle; idle = false; saver.classList.remove("on"); clearTimeout(idleT); idleT = setTimeout(sleep, IDLE_SECONDS * 1000); return was; }
document.addEventListener("keydown", function (e) {
  if (wake()) { e.preventDefault(); return; }          // first key only wakes the screen
  var k = e.key, c = e.keyCode;
  if (k === "ArrowRight" || c === 22) { setFocus(cur + 1); e.preventDefault(); }
  else if (k === "ArrowLeft" || c === 21) { setFocus(cur - 1); e.preventDefault(); }
  else if (k === "ArrowUp" || k === "ArrowDown" || c === 19 || c === 20) { e.preventDefault(); }   // nothing above or below yet
  else if (k === "Enter" || k === " " || c === 23 || c === 66) { launch(cur); e.preventDefault(); }
});
// The Android shell calls this when Home is pressed while the launcher is already open.
window.onHome = function () { wake(); setFocus(0); };
document.addEventListener("mousemove", function () { if (idle) wake(); });

/* ============================ boot ============================ */
loadCachedWx(); render(true); fetchWx();
setInterval(function () { render(false); }, 1000);
setInterval(fetchWx, WEATHER_REFRESH_MIN * 60 * 1000);
setFocus(0); wake();
</script>
</body>
</html>
